name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        # Zero dependencies: no install step. Runs TypeScript directly via
        # Node's built-in type stripping.
        run: node --experimental-strip-types --no-warnings --test test/*.test.ts

      - name: Smoke test (server boots + health endpoint)
        run: |
          node --experimental-strip-types --no-warnings src/index.ts &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://localhost:3000/api/health
          kill $SERVER_PID
        env:
          PORT: 3000
          API_ADMIN_TOKEN: ci-smoke-token
