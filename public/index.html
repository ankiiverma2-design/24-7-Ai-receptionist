<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoxDesk — AI Receptionist Console</title>
    <style>
      :root { --bg:#0e1116; --card:#171c26; --line:#252c3a; --fg:#e6e9ef; --mut:#8a93a6; --acc:#5b8cff; --ok:#3ecf8e; }
      * { box-sizing: border-box; }
      body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
      header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
      header h1 { font-size:18px; margin:0; }
      .tag { font-size:11px; color:var(--mut); border:1px solid var(--line); padding:2px 8px; border-radius:20px; }
      main { max-width:1100px; margin:0 auto; padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
      .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 12px; }
      .full { grid-column:1 / -1; }
      select, input, button, textarea { font:inherit; color:var(--fg); background:#0f141d; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
      button { background:var(--acc); border:none; color:#fff; cursor:pointer; font-weight:600; }
      button.sec { background:#0f141d; border:1px solid var(--line); }
      button:hover { opacity:.9; }
      .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .list { max-height:260px; overflow:auto; }
      .item { padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; }
      .item b { color:var(--fg); } .item span { color:var(--mut); }
      .muted { color:var(--mut); }
      .chat { background:#0f141d; border:1px solid var(--line); border-radius:8px; padding:10px; height:220px; overflow:auto; margin-bottom:8px; }
      .msg { margin:4px 0; } .msg.user b { color:var(--acc); } .msg.assistant b { color:var(--ok); }
      code { background:#0f141d; padding:1px 5px; border-radius:4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>VoxDesk</h1>
      <span class="tag">AI Receptionist Console</span>
      <span class="tag" id="health">checking…</span>
    </header>
    <main>
      <section class="card">
        <h2>1 · Create an agent from a template</h2>
        <div class="row">
          <select id="template"></select>
          <button id="create">Create Agent</button>
        </div>
        <p class="muted" id="createMsg"></p>
      </section>

      <section class="card">
        <h2>2 · Your agents</h2>
        <div class="row"><button class="sec" id="refreshAgents">Refresh</button></div>
        <div class="list" id="agents"></div>
      </section>

      <section class="card full">
        <h2>3 · Test the selected agent (text simulation)</h2>
        <div class="row">
          <select id="simAgent"></select>
          <span class="muted">Requires OPENAI_API_KEY on the server.</span>
        </div>
        <div class="chat" id="chat"></div>
        <div class="row">
          <input id="simInput" placeholder="Type what a caller would say…" style="flex:1" />
          <button id="send">Send</button>
        </div>
      </section>

      <section class="card">
        <h2>Recent calls</h2>
        <div class="row"><button class="sec" id="refreshCalls">Refresh</button></div>
        <div class="list" id="calls"></div>
      </section>

      <section class="card">
        <h2>Captured leads</h2>
        <div class="row"><button class="sec" id="refreshLeads">Refresh</button></div>
        <div class="list" id="leads"></div>
      </section>
    </main>

    <script>
      const TOKEN = new URLSearchParams(location.search).get('token') || 'change-me-dev-token';
      const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };
      const api = (p, opts = {}) => fetch('/api' + p, { headers: H, ...opts }).then((r) => r.json());
      const el = (id) => document.getElementById(id);
      let simHistory = [];

      async function health() {
        try { const h = await api('/health'); el('health').textContent = h.ok ? 'online' : 'error'; }
        catch { el('health').textContent = 'offline'; }
      }
      async function loadTemplates() {
        const { templates } = await api('/templates');
        el('template').innerHTML = templates.map((t) => `<option value="${t.id}">${t.name} — ${t.industry}</option>`).join('');
      }
      async function loadAgents() {
        const { agents } = await api('/agents');
        el('agents').innerHTML = agents.length ? agents.map((a) =>
          `<div class="item"><b>${a.name}</b> <span>· ${a.status} · v${a.version}</span><br><span>${a.id}</span>
           ${a.status !== 'live' ? `<br><button class="sec" data-pub="${a.id}">Publish</button>` : ''}</div>`).join('') : '<span class="muted">No agents yet.</span>';
        el('simAgent').innerHTML = agents.map((a) => `<option value="${a.id}">${a.name}</option>`).join('');
        document.querySelectorAll('[data-pub]').forEach((b) =>
          b.onclick = async () => { await api('/agents/' + b.dataset.pub + '/publish', { method: 'POST' }); loadAgents(); });
      }
      async function loadCalls() {
        const { calls } = await api('/calls');
        el('calls').innerHTML = calls.length ? calls.slice(-10).reverse().map((c) =>
          `<div class="item"><b>${c.direction}</b> <span>${c.from} → ${c.to}</span><br><span>${c.outcome || 'in progress'} · ${c.durationSec || 0}s</span></div>`).join('') : '<span class="muted">No calls yet.</span>';
      }
      async function loadLeads() {
        const { leads } = await api('/leads');
        el('leads').innerHTML = leads.length ? leads.slice(-10).reverse().map((l) =>
          `<div class="item"><b>${l.name || 'Unknown'}</b> <span>· score ${l.score || 0}</span><br><span>${l.service || ''} ${l.phone || ''}</span></div>`).join('') : '<span class="muted">No leads yet.</span>';
      }

      el('create').onclick = async () => {
        const templateId = el('template').value;
        const a = await api('/agents', { method: 'POST', body: JSON.stringify({ templateId }) });
        el('createMsg').textContent = a.id ? `Created ${a.name} (${a.id})` : 'Error creating agent';
        loadAgents();
      };
      el('refreshAgents').onclick = loadAgents;
      el('refreshCalls').onclick = loadCalls;
      el('refreshLeads').onclick = loadLeads;

      function renderChat() {
        el('chat').innerHTML = simHistory.map((m) => `<div class="msg ${m.role}"><b>${m.role === 'user' ? 'Caller' : 'Agent'}:</b> ${m.content}</div>`).join('');
        el('chat').scrollTop = el('chat').scrollHeight;
      }
      el('send').onclick = async () => {
        const txt = el('simInput').value.trim();
        if (!txt) return;
        simHistory.push({ role: 'user', content: txt });
        el('simInput').value = ''; renderChat();
        const agentId = el('simAgent').value;
        const res = await api('/agents/' + agentId + '/simulate', { method: 'POST', body: JSON.stringify({ messages: simHistory }) });
        simHistory.push({ role: 'assistant', content: res.reply || ('[' + (res.message || res.error || 'no reply') + ']') });
        renderChat(); loadCalls(); loadLeads();
      };
      el('simAgent').onchange = () => { simHistory = []; renderChat(); };

      health(); loadTemplates(); loadAgents(); loadCalls(); loadLeads();
    </script>
  </body>
</html>
